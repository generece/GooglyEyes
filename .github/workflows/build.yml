name: Derle ve yayınla

# main'e her push'ta uygulamayı derleyip hazır .app olarak yayınlar.
# Kurulum ve uygulama içi güncelleme, en son yayını (latest release) indirir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Derle (Apple Silicon + Intel) ve imzala
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: bash ci/build-release.sh

      - name: Yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          gh release create "v$VER-$SHORT" dist/GooglyEyes.zip \
            --title "GooglyEyes $VER ($SHORT)" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA" --latest
